name: build-test
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build devcontainer
        run: |
          docker build -t vps-test -f .devcontainer/Dockerfile .
      - name: Verify image
        run: |
          docker run --rm vps-test bash -c 'cat /etc/os-release | head -2; which Xvnc startplasma-x11 google-chrome-stable 2>&1 | head'
      - name: Discover KDE launch bits
        run: |
          docker run --rm vps-test bash -c '
            echo "== dnf provides kwin_x11 ==";
            dnf provides "*kwin_x11*" -y 2>&1 | grep -vE "^$|Downloading|Metadata|Package" | head -20;
            echo "== dnf list kwin* ==";
            dnf list available "kwin*" 2>&1 | grep -E "^kwin|^ " | head -20;
            echo "== startplasma/ksmserver bins ==";
            ls -la /usr/bin/startplasma* /usr/sbin/ksmserver /usr/bin/ksmserver 2>&1;
            echo "== kwin wayland/x11 which ==";
            which kwin_wayland kwin_x11 2>&1 || true'
      - name: Functional sshd check
        run: |
          docker run --rm vps-test bash -c '
            which sshd;
            sshd -t && echo "config-ok";
            mkdir -p /run/sshd;
            /usr/sbin/sshd; sleep 2;
            ps aux | grep -E "[s]shd" | head -3;
            ss -tlnp 2>/dev/null | grep 2222 || echo "no-2222-listener"'
