name: build-test
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build devcontainer
        run: |
          docker build -t vps-test -f .devcontainer/Dockerfile .
      - name: Verify image
        run: |
          docker run --rm vps-test bash -c 'cat /etc/os-release | head -2; which Xvnc startplasma-x11 google-chrome-stable 2>&1 | head'
      - name: Discover KDE launch bits
        run: |
          docker run --rm vps-test bash -c 'echo "== startplasma =="; find /usr -name "startplasma*" 2>/dev/null; echo "== kwin files =="; find /usr -name "kwin*" 2>/dev/null | head -20; echo "== kwin_x11 which =="; which kwin_x11 kwin_wayland 2>&1; echo "== rpm owner startplasma =="; rpm -qf /usr/bin/startplasma 2>&1; echo "== startplasma head =="; head -40 /usr/bin/startplasma'
